<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 128" width="1200" height="128" role="img" aria-label="데이터보다 스키마가 먼저다 - 온톨로지가 지식그래프에 사 주는 네 가지">
<defs><clipPath id="c"><rect width="1200" height="128" rx="18"/></clipPath><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141838"/><stop offset="1" stop-color="#070914"/></linearGradient>
<radialGradient id="o"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>.sh{animation:sh 7s ease-in-out infinite}
@keyframes sh{0%,62%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(140%) skewX(-20deg)}}.ar{animation:ar 2.4s ease-in-out infinite}@keyframes ar{50%{transform:translateX(8px)}}</style>
<g clip-path="url(#c)"><rect width="1200" height="128" fill="url(#s)"/><ellipse cx="1104" cy="0" rx="504" ry="122" fill="url(#o)"/>
<rect x="24" y="24" width="96" height="80" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/>
<text x="72" y="74" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="700" fill="#34d399">#23</text>
<text x="146" y="40" font-family="'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif" font-size="15" fill="#34d399">연구 회고 · 17분 읽기</text>
<text x="146" y="74" font-family="'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif" font-size="29" font-weight="700" fill="#f3f4f6">데이터보다 스키마가 먼저다</text>
<text x="146" y="104" font-family="'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif" font-size="19" fill="#a4abb8">온톨로지가 지식그래프에 사 주는 네 가지</text>
<text class="ar" x="1138" y="76" font-family="'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif" font-size="32" fill="#34d399">→</text>
<rect class="sh" width="360" height="128" fill="url(#sh)"/></g>
<rect x=".5" y=".5" width="1199" height="127" rx="18" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
