name: Refresh profile

on:
  schedule:
    - cron: "17 15 * * *"   # every day 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py
      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#34d399&color_dots=#161b33,#25307a,#3a4cf0,#8b9bff,#34d399
            dist/snake-light.svg?color_snake=#3a4cf0&color_dots=#ebedf0,#c7cdfc,#8b9bff,#3a4cf0,#047857
      - name: Commit if changed
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cp dist/snake-*.svg assets/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile telemetry"
          git push
